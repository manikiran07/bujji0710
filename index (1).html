<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#25173f; --bg2:#33205a; --ink:#f6efff; --muted:#bfaedd;
  --gold:#ffb83d; --rose:#f25c7a; --mint:#7fd8be; --paper:#fff6e6; --paper-ink:#3a2a1d;
  --head:'Bricolage Grotesque',system-ui,sans-serif; --hand:'Caveat','Segoe Script',cursive;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif;overflow-x:hidden}
h1,h2{font-family:var(--head);margin:0;line-height:1.05}
section{padding:72px 22px;max-width:880px;margin:0 auto}
h2{font-size:clamp(28px,6vw,44px);margin-bottom:28px}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* hero */
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;max-width:none;}
.string{position:absolute;top:0;left:0;right:0;height:130px;pointer-events:none}
.lanterns{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-around;padding:0 4%}
.lantern{width:46px;height:62px;margin-top:34px;border-radius:14px 14px 18px 18px;background:#5a3f86;position:relative;transform-origin:top center;
  transition:background .6s,box-shadow .6s;animation:sway 3.6s ease-in-out infinite,bob 2.8s ease-in-out infinite}
.lantern::before{content:"";position:absolute;left:50%;top:-34px;width:2px;height:34px;background:var(--muted);opacity:.5}
.lantern:nth-child(2n){animation-delay:-1.3s;height:54px}
.lantern:nth-child(3n){animation-delay:-2.4s}
.lit .lantern{background:var(--gold);box-shadow:0 0 34px 8px rgba(255,184,61,.55)}
.lit .lantern:nth-child(2n){background:var(--rose);box-shadow:0 0 34px 8px rgba(242,92,122,.5)}
.lit .lantern:nth-child(3n){background:var(--mint);box-shadow:0 0 34px 8px rgba(127,216,190,.45)}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes bob{50%{translate:0 8px}}
.hero h1{font-size:clamp(46px,13vw,120px);font-weight:800;letter-spacing:-.03em}
.hero p{max-width:30ch;color:var(--muted);margin:18px auto 30px}
.btn{background:var(--gold);color:#2a1a00;border:0;border-radius:999px;padding:14px 28px;font-weight:700;transition:transform .15s}
.btn:hover{transform:scale(1.04)}
.btn[disabled]{opacity:.6;cursor:default;transform:none}

/* timeline */
.line{position:relative;padding-left:28px;border-left:3px solid var(--rose)}
.mem{position:relative;margin-bottom:44px}
.mem::before{content:"";position:absolute;left:-39px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--gold);border:3px solid var(--bg)}
.mem time{font-family:var(--hand);font-size:26px;color:var(--gold)}
.mem h3{font-family:var(--head);font-size:24px;margin:2px 0 8px}
.mem p{margin:0 0 14px;max-width:56ch;color:#e6dbf7}
.frame{background:#fff;padding:10px 10px 34px;border-radius:4px;max-width:340px;transform:rotate(-1.5deg);box-shadow:0 14px 30px rgba(0,0,0,.35)}
.mem:nth-child(even) .frame{transform:rotate(1.8deg)}
.frame .ph{aspect-ratio:4/3;background:linear-gradient(135deg,#d9c8f5,#ffd9b0);display:grid;place-items:center;color:#6a5090;font:14px system-ui;text-align:center;overflow:hidden}
.frame img{width:100%;height:100%;object-fit:cover;display:block}


/* aurora + glass + gloss */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(160deg,#1d1136,#2a1850 55%,#1a1030)}
.aurora span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.6;width:55vmax;height:55vmax;animation:drift 24s ease-in-out infinite alternate}
.aurora span:nth-child(1){background:var(--rose);top:-18vmax;left:-14vmax}
.aurora span:nth-child(2){background:#7a5cff;top:20vh;right:-22vmax;animation-delay:-8s}
.aurora span:nth-child(3){background:var(--gold);bottom:-26vmax;left:8vw;opacity:.42;animation-delay:-15s}
.aurora span:nth-child(4){background:var(--mint);top:48vh;left:-26vmax;opacity:.3;animation-delay:-4s}
@keyframes drift{to{transform:translate(9vmax,-7vmax) scale(1.18)}}
.hero h1{text-shadow:0 0 40px rgba(255,184,61,.35),0 2px 0 rgba(255,255,255,.15)}
.lantern::after{content:"";position:absolute;left:16%;top:10%;width:34%;height:46%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.6),transparent)}
.mem{padding:22px 22px 26px;border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 18px 40px rgba(10,4,30,.35);
  -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%)}
.mem::before{top:26px}
.btn{position:relative;overflow:hidden;box-shadow:0 8px 28px rgba(255,184,61,.45),inset 0 2px 0 rgba(255,255,255,.55)}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{55%,100%{left:140%}}
.letter{position:relative;overflow:hidden}
.letter::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 32%);pointer-events:none}



/* quote + photo timeline */
.mem .q{margin:0 0 16px;position:relative;padding-left:46px;font-family:var(--hand);font-size:clamp(24px,4.8vw,30px);line-height:1.3}
.mem .q::before{content:"\201C";position:absolute;left:0;top:-4px;font:800 62px/1 var(--head);color:var(--gold)}
.mem .cap{font-family:var(--hand);font-size:24px;color:var(--muted);margin:12px 0 0}
@media (max-width:600px){.mem .q{padding-left:38px}.mem .q::before{font-size:50px}}
/* lantern motion, cursor, touch ripple */
.lantern:nth-child(2n){animation-duration:3s,2.4s}
.lantern:nth-child(3n){animation-duration:4.6s,3.3s}
.cur-dot,.cur-ring{display:none;position:fixed;left:0;top:0;pointer-events:none;border-radius:50%;opacity:0;transition:opacity .25s}
.fx-cursor .cur-dot,.fx-cursor .cur-ring{display:block}
.cur-dot{width:10px;height:10px;margin:-5px 0 0 -5px;background:var(--gold);box-shadow:0 0 16px 4px rgba(255,184,61,.75);z-index:21}
.cur-ring{width:38px;height:38px;margin:-19px 0 0 -19px;border:2px solid rgba(255,255,255,.75);z-index:20;
  transition:opacity .25s,width .2s,height .2s,margin .2s,border-color .2s,background .2s}
.cur-ring.big{width:66px;height:66px;margin:-33px 0 0 -33px;border-color:var(--rose);background:rgba(242,92,122,.16)}
html.fx-cursor,html.fx-cursor *{cursor:none!important}
.ripple{position:fixed;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid var(--gold);pointer-events:none;z-index:20;
  box-shadow:0 0 18px rgba(255,184,61,.6);animation:rip .7s ease-out forwards}
@keyframes rip{to{transform:scale(6);opacity:0}}

/* letter */
.letter{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:clamp(24px,6vw,52px);font-family:var(--hand);font-size:clamp(23px,4.6vw,30px);line-height:1.5;
  box-shadow:0 20px 40px rgba(0,0,0,.4);background-image:repeating-linear-gradient(transparent 0 43px,rgba(150,110,70,.18) 43px 44px)}
.letter p{margin:0 0 18px}.letter .sig{text-align:right;font-weight:700}

/* gift */
.gift{text-align:center}
.env{width:min(320px,86vw);aspect-ratio:3/2;margin:0 auto 26px;background:var(--paper);border-radius:8px;position:relative;box-shadow:0 18px 36px rgba(0,0,0,.4);display:grid;place-items:center;border:0;color:var(--paper-ink)}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49.5%,rgba(0,0,0,.12) 50%) ,linear-gradient(to bottom left,transparent 49.5%,rgba(0,0,0,.12) 50%);clip-path:polygon(0 0,100% 0,50% 62%);}
.env span{position:relative;font-family:var(--hand);font-size:30px;margin-top:40px}
.reveal{max-height:0;overflow:hidden;opacity:0;transition:max-height .8s,opacity .8s}
.opened .reveal{max-height:1100px;opacity:1}
.gframe{margin:0 auto 22px;transform:rotate(-1deg)}
.reveal h3{font-family:var(--head);font-size:clamp(26px,6vw,40px);color:var(--gold);margin:0 0 10px}
.reveal p{max-width:44ch;margin:0 auto}
footer{text-align:center;color:var(--muted);padding:40px 20px 70px;font-family:var(--hand);font-size:24px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}

/* mobile */
@media (hover:none){.btn:hover{transform:none}}
@media (max-width:600px){
  body{font-size:17px}
  section{padding:52px 16px}
  h2{margin-bottom:22px}
  .lanterns{padding:0 3%}
  .lantern{width:30px;height:42px;margin-top:30px;border-radius:10px 10px 13px 13px}
  .lantern:nth-child(2n){height:36px}
  .lantern:nth-child(n+8){display:none}
  .hero{padding:110px 18px 48px}
  .hero p{margin:16px auto 26px}
  .btn{min-height:50px;padding:14px 30px}
  .line{padding-left:20px}
  .mem{padding:16px 16px 20px;margin-bottom:30px;border-radius:16px}
  .mem::before{left:-30px;top:20px}
  .mem time{font-size:24px}
  .mem h3{font-size:21px}
  .frame{max-width:100%;padding:8px 8px 28px}
  .letter{line-height:1.45}
  .aurora span{filter:blur(60px);width:80vmax;height:80vmax}
  .mem{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  footer{padding:30px 16px calc(60px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:360px){.hero h1{font-size:40px}.lantern:nth-child(n+7){display:none}}
@media (prefers-reduced-motion:reduce){.lantern,.aurora span,.btn::after{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
<canvas id="fx" aria-hidden="true"></canvas>

<header class="hero" id="top">
  <div class="string" aria-hidden="true"><div class="lanterns" id="lanterns"></div></div>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <button class="btn" id="light">Light the lanterns</button>
</header>

<section aria-labelledby="mh">
  <h2 id="mh">The story so far</h2>
  <div class="line" id="mems"></div>
</section>

<section aria-labelledby="lh">
  <h2 id="lh">A letter for you</h2>
  <div class="letter" id="letter"></div>
</section>

<section class="gift" id="giftSec" aria-labelledby="gh">
  <h2 id="gh">One last thing</h2>
  <button class="env" id="env" aria-expanded="false"><span>Open me</span></button>
  <div class="reveal" id="reveal"><h3 id="gTitle"></h3><div class="frame gframe"><div class="ph" id="gPh"></div></div><p id="gText"></p></div>
</section>

<footer id="foot"></footer>

<script>
/* ========= EDIT THIS PART ========= */
const CONFIG = {
  name: "Bujji Akka",
  from: "Your thammudu, Mani",
  subtitle: "Today is all yours, Akka. Scroll down, there's a lot waiting for you.",
  // photo: paste a data: URL (or leave "" to show a placeholder frame)
  story: [
    {quote:"A sister is the one person who knew you before you became anyone, and loved you anyway.", caption:"Where it all started", photo:"photos/01.jpg"},
    {quote:"One phone, two people, zero chance of sharing. 'Just five minutes' was always an hour.", caption:"Who gets the phone?", photo:"photos/02.jpg"},
    {quote:"You saw my message and replied three hours later with 'ok'. I wrote a paragraph, Akka.", caption:"Seen, no reply", photo:"photos/03.jpg"},
    {quote:"Friends come and go. An akka stays, scolds you, and still saves you the last bite.", caption:"Always there", photo:"photos/04.jpg"},
    {quote:"I called you 5 times and you didn't pick up. Then you asked why I called so much. Akka, that's why.", caption:"The missed call war", photo:"photos/05.jpg"},
    {quote:"You scold me, and then you ask if I've eaten. That's how I know it's love.", caption:"Scolding with love", photo:"photos/06.jpg"},
    {quote:"You're the only person who can annoy me and cheer me up in the same minute.", caption:"Annoying, but mine", photo:"photos/07.jpg"},
    {quote:"Nobody else can make me laugh until my ribs hurt. Only you.", caption:"Laughing too hard", photo:"photos/08.jpg"},
    {quote:"We fought over everything, and I'd fight anyone who tried to fight you.", caption:"Team us", photo:"photos/09.jpg"},
    {quote:"I'll never say it enough, so I'll say it now: I'm so lucky you're my akka.", caption:"Lucky me", photo:"photos/10.jpg"},
    {quote:"Your voice notes are 4 minutes long. I listen to every one anyway.", caption:"The voice notes", photo:"photos/11.jpg"},
    {quote:"Distance changes nothing. You're still my first call.", caption:"Still my first call", photo:"photos/12.jpg"},
    {quote:"Some people get a second mother. I got one who also reads my messages.", caption:"Still the best team", photo:"photos/13.jpg"},
    {quote:"I don't need a perfect day. A normal day with you is enough.", caption:"Just us", photo:"photos/14.jpg"}
  ],
  letter: [
    "Dear Bujji Akka,",
    "Happy birthday! I'm not great at saying things out loud, so I built you a whole website instead.",
    "You're my everything, Akka. You already know that.",
    "You matter to me. You matter so much. So, so, so much more than you'll ever be able to comprehend.",
    "Your existence brings an infinite amount of goodness into the world, and every moment spent with you brings happiness into my heart like nothing else can.",
    "I'll be here for you whenever you need me. It doesn't matter how far apart we are, or how long we've gone without talking. I've got you. I'm not going anywhere.",
    "I believe that, regardless of when or where, in another existence or lifetime, you and I will always be bound together.",
    "You're not getting rid of me that easy.",
    "I won't be able to fix all of your problems, but you'll never have to face them alone. I may not have all the answers or solutions, but I do have all the time in the world for you. No matter what.",
    "I genuinely don't think I'd be the person I am today if it wasn't for you. I mean that from the bottom of my heart.",
    "Seeing you happy makes my heart smile. There's nothing more I want in this world than for you to live the beautiful life you deserve.",
    "I just want you to know that you can do absolutely anything you put your mind to. I know it's cliche, but it's true. You possess every single capability you need to smash every single one of your goals, and to set up your dream life. I'm going to be with you every step of the way (whether you like it or not).",
    "You're so much stronger than you give yourself credit for. You're so much more powerful than you think. Please don't let anyone ever tell you otherwise.",
    "The thing about our relationship is when we laugh, we laugh. Like really, really. We laugh so hard it starts to hurt our ribs and makes our smiles ache a silly amount. No one can make me laugh quite like you do. When we're together, we're together. We're an absolute nightmare.",
    "I love being your brother.",
    "We're the best."
  ],
  giftTitle: "This one's for you",
  giftText: "Some things are worth keeping. Happy birthday, Bujji Akka.",
  giftPhoto: "photos/gift.jpg",
  footer: "Made with love, just for you."
};
/* ========= END EDIT ========= */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.title = "Happy Birthday, " + CONFIG.name;
$('title').textContent = "Happy Birthday, " + CONFIG.name;
$('sub').textContent = CONFIG.subtitle;
$('lanterns').innerHTML = '<span class="lantern"></span>'.repeat(9);

$('mems').innerHTML = CONFIG.story.map(m => `
  <article class="mem">
    <blockquote class="q">${esc(m.quote)}</blockquote>
    <div class="frame"><div class="ph">${m.photo ? `<img src="${esc(m.photo)}" alt="${esc(m.caption)}">` : 'Your photo goes here'}</div></div>
    <p class="cap">${esc(m.caption)}</p>
  </article>`).join('');

$('letter').innerHTML = CONFIG.letter.map(p => `<p>${esc(p)}</p>`).join('') + `<p class="sig">${esc(CONFIG.from)}</p>`;
$('gTitle').textContent = CONFIG.giftTitle;
$('gText').textContent = CONFIG.giftText;
$('gPh').innerHTML = CONFIG.giftPhoto ? `<img src="${esc(CONFIG.giftPhoto)}" alt="Your gift">` : 'Your gift photo goes here';
$('foot').textContent = CONFIG.footer;

/* confetti */
const cv = $('fx'), cx = cv.getContext('2d');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let bits = [], sp = [], raf = 0;
function size(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', size); size();
function burst(n = 140){
  if (still) return;
  const cols = ['#ffb83d','#f25c7a','#7fd8be','#ffffff','#b794f6'];
  for (let i = 0; i < n; i++) bits.push({
    x: innerWidth/2, y: innerHeight*0.4, vx: (Math.random()-.5)*16, vy: -Math.random()*14-4,
    r: Math.random()*6+3, c: cols[i%cols.length], a: Math.random()*6, va: (Math.random()-.5)*.4, life: 0
  });
  if (!raf) raf = requestAnimationFrame(tick);
}
function sparkle(x, y, n, spread){
  if (still) return;
  const cols = ['#ffd27a','#ff8fa6','#9ff0d8','#ffffff','#c9b3ff'];
  for (let i = 0; i < n; i++) sp.push({
    x, y, vx:(Math.random()-.5)*spread*2, vy:(Math.random()-.5)*spread*2 - .3,
    r:Math.random()*5+4, c:cols[(Math.random()*cols.length)|0], life:0, max:30+Math.random()*25
  });
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits = bits.filter(b => b.life < 160);
  for (const b of bits){
    b.vy += .35; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.a += b.va; b.life++;
    cx.save(); cx.translate(b.x,b.y); cx.rotate(b.a); cx.fillStyle = b.c;
    cx.globalAlpha = Math.max(0, 1 - b.life/160); cx.fillRect(-b.r, -b.r/2, b.r*2, b.r); cx.restore();
  }
  sp = sp.filter(q => q.life < q.max);
  for (const q of sp){
    q.vy += .04; q.x += q.vx; q.y += q.vy; q.life++;
    const k = 1 - q.life/q.max, r = q.r*k;
    cx.save(); cx.translate(q.x,q.y); cx.globalAlpha = k; cx.fillStyle = q.c; cx.shadowColor = q.c; cx.shadowBlur = 10;
    cx.beginPath(); cx.moveTo(0,-r); cx.quadraticCurveTo(0,0,r,0); cx.quadraticCurveTo(0,0,0,r);
    cx.quadraticCurveTo(0,0,-r,0); cx.quadraticCurveTo(0,0,0,-r); cx.fill(); cx.restore();
  }
  raf = (bits.length || sp.length) ? requestAnimationFrame(tick) : 0;
}

$('light').addEventListener('click', e => {
  document.querySelector('.hero').classList.add('lit');
  e.target.textContent = "Happy birthday!"; e.target.disabled = true;
  burst();
  setTimeout(() => $('mems').scrollIntoView({behavior: still ? 'auto' : 'smooth', block:'start'}), 1600);
});
$('env').addEventListener('click', () => {
  const s = $('giftSec'); const open = s.classList.toggle('opened');
  $('env').setAttribute('aria-expanded', open);
  $('env').querySelector('span').textContent = open ? "Open" : "Open me";
  if (open) burst(200);
});

/* lanterns swing when touched or approached */
const lan = [...document.querySelectorAll('.lantern')].map(el => ({el, a:0, v:0}));
let lanRun = 0;
function lanLoop(){
  let busy = false;
  for (const l of lan){
    l.v += -l.a * .05; l.v *= .965; l.a += l.v;
    if (Math.abs(l.a) > .05 || Math.abs(l.v) > .05) busy = true; else l.a = l.v = 0;
    l.el.style.rotate = l.a.toFixed(2) + 'deg';
  }
  lanRun = busy ? requestAnimationFrame(lanLoop) : 0;
}
function pushLanterns(x, y, radius, power){
  if (still) return;
  for (const l of lan){
    const r = l.el.getBoundingClientRect();
    if (!r.width) continue;
    const dx = r.left + r.width/2 - x, dy = r.top + r.height/2 - y, d = Math.hypot(dx, dy);
    if (d < radius) l.v += Math.sign(dx || 1) * (1 - d/radius) * power;
  }
  if (!lanRun) lanRun = requestAnimationFrame(lanLoop);
}

/* desktop: glowing orb cursor with a sparkle trail */
if (matchMedia('(hover:hover) and (pointer:fine)').matches && !still){
  document.documentElement.classList.add('fx-cursor');
  const dot = document.createElement('div'), ring = document.createElement('div');
  dot.className = 'cur-dot'; ring.className = 'cur-ring';
  document.body.append(ring, dot);
  let mx = 0, my = 0, rx = 0, ry = 0, shown = false, last = 0;
  addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    mx = e.clientX; my = e.clientY;
    dot.style.transform = `translate(${mx}px,${my}px)`;
    if (!shown){ shown = true; rx = mx; ry = my; dot.style.opacity = ring.style.opacity = 1; }
    const now = performance.now();
    if (now - last > 40){ last = now; sparkle(mx, my, 1, .7); }
    pushLanterns(mx, my, 150, 2.2);
  });
  addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') sparkle(e.clientX, e.clientY, 14, 3.2); });
  document.addEventListener('pointerover', e => ring.classList.toggle('big', !!e.target.closest('button')));
  document.documentElement.addEventListener('mouseleave', () => { shown = false; dot.style.opacity = ring.style.opacity = 0; });
  (function follow(){ rx += (mx - rx) * .18; ry += (my - ry) * .18; ring.style.transform = `translate(${rx}px,${ry}px)`; requestAnimationFrame(follow); })();
}

/* touch screens: ripple + sparkles where you tap or drag */
if (!still){
  function ripple(x, y){
    const d = document.createElement('div'); d.className = 'ripple';
    d.style.left = x + 'px'; d.style.top = y + 'px'; document.body.appendChild(d);
    d.addEventListener('animationend', () => d.remove());
  }
  let lastT = 0;
  addEventListener('touchstart', e => {
    const t = e.touches[0]; ripple(t.clientX, t.clientY); sparkle(t.clientX, t.clientY, 12, 3); pushLanterns(t.clientX, t.clientY, 180, 4);
  }, {passive:true});
  addEventListener('touchmove', e => {
    const t = e.touches[0], now = performance.now();
    if (now - lastT > 35){ lastT = now; sparkle(t.clientX, t.clientY, 2, 1.3); }
    pushLanterns(t.clientX, t.clientY, 150, 1.6);
  }, {passive:true});
}
</script>
